<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Customer Area Route Tracker</title>

  <!-- Cloudflare CDN for Leaflet & Routing -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body, html { height: 100%; width: 100%; overflow: hidden; background: #f3f4f6; }

    /* Top Control Bar */
    .top-bar {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
      background: #ffffff; padding: 10px 12px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12); display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .top-bar select {
      flex: 1; min-width: 150px; padding: 10px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 14px; font-weight: 600; background: #f9fafb;
    }
    .btn {
      padding: 10px 12px; border: none; border-radius: 8px; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: 0.15s;
    }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-outline { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }

    /* Map Container */
    #map { height: 100%; width: 100%; z-index: 1; }

    /* Bottom Active Stop & Queue Panel */
    .bottom-panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: #ffffff; border-radius: 18px 18px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15); padding: 14px 16px;
      max-height: 46vh; display: flex; flex-direction: column; gap: 10px;
    }
    .active-card {
      background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 12px;
    }
    .active-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .badge {
      background: #1a73e8; color: #fff; font-size: 11px; font-weight: 700;
      padding: 3px 8px; border-radius: 99px; text-transform: uppercase;
    }
    .shop-title { font-size: 16px; font-weight: 700; color: #111827; }
    .action-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .action-row .btn, .action-row a { flex: 1; text-align: center; text-decoration: none; }

    /* Shop Sequence List */
    .shop-list { overflow-y: auto; border-top: 1px solid #e5e7eb; padding-top: 8px; }
    .shop-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 6px; border-bottom: 1px solid #f3f4f6; font-size: 13px; cursor: pointer;
    }
    .shop-item.visited { opacity: 0.5; text-decoration: line-through; }
    .shop-num {
      display: inline-block; width: 22px; height: 22px; border-radius: 50%;
      background: #e5e7eb; color: #111827; text-align: center; line-height: 22px;
      font-weight: 700; font-size: 11px; margin-right: 8px;
    }

    /* Collapse Leaflet default routing box so map stays clean */
    .leaflet-routing-container {
      max-height: 130px; overflow-y: auto; font-size: 12px;
      margin-top: 70px !important; border-radius: 8px !important;
    }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <div class="top-bar">
    <select id="areaSelect">
      <option value="">Loading areas...</option>
    </select>
    <button class="btn btn-primary" onclick="locateAndStartRoute()">📍 Start Nearest Route</button>
    <button class="btn btn-outline" onclick="loadSheetData()">🔄 Reload</button>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Bottom Active Shop & Route Queue -->
  <div class="bottom-panel">
    <div id="activeStopContainer" class="active-card">
      <div class="active-header">
        <span class="badge" id="stopBadge">Loading</span>
        <span id="distanceText" style="font-size: 12px; font-weight: 600; color: #1e40af;"></span>
      </div>
      <div class="shop-title" id="activeShopName">Connecting to Google Sheet...</div>
      <div class="action-row" id="activeActions" style="display: none;">
        <button class="btn btn-success" onclick="markCurrentVisited()">✅ Reached / Next Shop</button>
        <a id="callBtn" class="btn btn-outline" href="#" style="display:none;">📞 Call</a>
        <a id="gmapsBtn" class="btn btn-outline" href="#" target="_blank">🗺️ G-Maps App</a>
      </div>
    </div>

    <div class="shop-list" id="shopList"></div>
  </div>

  <!-- Cloudflare JS Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // HARDCODED GOOGLE SHEET PUBLISHED CSV URL
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSAKuQG7Ap1FQQLm_5yiiFvgA7UFzjqmhRlxyHRFtYfBK7O2H4NkgGFBXoNTdLlvYPUAnHLDerZDucl/pub?output=csv";

    let allCustomers = [];
    let areaShops = [];
    let userLocation = null;
    let currentTargetShop = null;
    let routingControl = null;
    let map = null;
    let markersLayer = null;
    let userMarker = null;

    // Initialize Map with 100% Free OpenStreetMap Tiles (No API Key Required)
    try {
      map = L.map('map', { zoomControl: false }).setView([18.5196, 73.8553], 13);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
    } catch (err) {
      document.getElementById("activeShopName").innerText = "Map library failed to load: " + err.message;
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function processParsedRows(rows) {
      allCustomers = [];

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length < 4) continue;

        const area = String(row[0] || "").trim();
        const name = String(row[1] || "").trim();
        const lat = parseFloat(String(row[2] || "").replace(/[^\d.-]/g, ""));
        const lng = parseFloat(String(row[3] || "").replace(/[^\d.-]/g, ""));
        const phone = String(row[4] || "").trim();
        const mapsLink = String(row[5] || "").trim();

        if (area && name && !isNaN(lat) && !isNaN(lng)) {
          allCustomers.push({
            id: i,
            area,
            name,
            lat,
            lng,
            phone,
            mapsLink,
            visited: false
          });
        }
      }

      if (allCustomers.length === 0) {
        document.getElementById("stopBadge").innerText = "Check Sheet";
        document.getElementById("activeShopName").innerText = "Sheet loaded, but no valid Latitude/Longitude numbers were found in Columns C & D.";
        return;
      }

      populateAreaDropdown();
      document.getElementById("stopBadge").innerText = "Ready";
      document.getElementById("activeShopName").innerText = `Loaded ${allCustomers.length} shops. Select an area above to begin.`;
    }

    async function loadSheetData() {
      document.getElementById("stopBadge").innerText = "Loading...";
      document.getElementById("activeShopName").innerText = "Fetching customer data from Google Sheets...";

      try {
        const response = await fetch(SHEET_CSV_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const csvText = await response.text();
        const parsed = Papa.parse(csvText, { header: false, skipEmptyLines: true });
        processParsedRows(parsed.data);
      } catch (err1) {
        Papa.parse(SHEET_CSV_URL, {
          download: true,
          header: false,
          skipEmptyLines: true,
          complete: function(results) {
            processParsedRows(results.data);
          },
          error: function() {
            document.getElementById("stopBadge").innerText = "Error";
            document.getElementById("activeShopName").innerText = "Could not read Google Sheet. Ensure the sheet is Published to Web as CSV.";
          }
        });
      }
    }

    function populateAreaDropdown() {
      const select = document.getElementById("areaSelect");
      const areas = [...new Set(allCustomers.map(c => c.area))].sort();
      select.innerHTML = '<option value="">-- Select Area (' + areas.length + ') --</option>';
      areas.forEach(area => {
        const opt = document.createElement("option");
        opt.value = area;
        opt.textContent = area;
        select.appendChild(opt);
      });

      select.onchange = () => {
        filterByArea(select.value);
      };
    }

    function filterByArea(areaName) {
      if (!markersLayer) return;
      markersLayer.clearLayers();
      if (routingControl) {
        map.removeControl(routingControl);
        routingControl = null;
      }

      areaShops = allCustomers.filter(c => c.area === areaName);
      if (areaShops.length === 0) return;

      const bounds = [];
      areaShops.forEach(shop => {
        const marker = L.marker([shop.lat, shop.lng]).addTo(markersLayer);
        marker.bindPopup(`<b>${shop.name}</b><br><button onclick="routeToSpecificShop(${shop.id})" style="margin-top:5px;padding:4px 8px;cursor:pointer;">Route Here Now</button>`);
        bounds.push([shop.lat, shop.lng]);
      });

      map.fitBounds(bounds, { padding: [50, 50] });
      renderShopSequence();
      document.getElementById("stopBadge").innerText = areaName;
      document.getElementById("activeShopName").innerText = `${areaShops.length} shops loaded. Tap "📍 Start Nearest Route".`;
      document.getElementById("activeActions").style.display = "none";
      document.getElementById("distanceText").innerText = "";
    }

    function locateAndStartRoute() {
      if (areaShops.length === 0) {
        alert("Please select an Area from the dropdown first.");
        return;
      }

      document.getElementById("stopBadge").innerText = "Locating GPS...";
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            updateUserMarker();
            sortShopsByNearestChain(userLocation.lat, userLocation.lng);
            routeToNextUnvisited();
          },
          () => {
            const fallbackLat = areaShops[0] ? areaShops[0].lat : map.getCenter().lat;
            const fallbackLng = areaShops[0] ? areaShops[0].lng : map.getCenter().lng;
            userLocation = { lat: fallbackLat, lng: fallbackLng };
            alert("GPS permission unavailable. Starting route from the first shop in this area.");
            updateUserMarker();
            sortShopsByNearestChain(userLocation.lat, userLocation.lng);
            routeToNextUnvisited();
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      }
    }

    function updateUserMarker() {
      if (!userLocation || !map) return;
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([userLocation.lat, userLocation.lng], {
        radius: 8, fillColor: "#1a73e8", color: "#fff", weight: 3, fillOpacity: 1
      }).addTo(map).bindPopup("Your Current Location");
    }

    function sortShopsByNearestChain(startLat, startLng) {
      const visited = areaShops.filter(s => s.visited);
      const unvisited = areaShops.filter(s => !s.visited);
      const ordered = [];
      let currLat = startLat;
      let currLng = startLng;

      while (unvisited.length > 0) {
        let nearestIdx = 0;
        let minDist = Infinity;
        for (let i = 0; i < unvisited.length; i++) {
          const d = getDistanceKm(currLat, currLng, unvisited[i].lat, unvisited[i].lng);
          if (d < minDist) {
            minDist = d;
            nearestIdx = i;
          }
        }
        const nextShop = unvisited.splice(nearestIdx, 1)[0];
        nextShop.distanceFromPrev = minDist;
        ordered.push(nextShop);
        currLat = nextShop.lat;
        currLng = nextShop.lng;
      }

      areaShops = [...ordered, ...visited];
      renderShopSequence();
    }

    function routeToNextUnvisited() {
      const nextShop = areaShops.find(s => !s.visited);
      if (!nextShop) {
        document.getElementById("stopBadge").innerText = "Completed";
        document.getElementById("activeShopName").innerText = "🎉 All shops in this area visited!";
        document.getElementById("activeActions").style.display = "none";
        document.getElementById("distanceText").innerText = "";
        if (routingControl) map.removeControl(routingControl);
        return;
      }
      drawRouteToShop(nextShop);
    }

    window.routeToSpecificShop = function(shopId) {
      const shop = areaShops.find(s => s.id === shopId);
      if (shop) drawRouteToShop(shop);
    };

    function drawRouteToShop(shop) {
      currentTargetShop = shop;
      const startPt = userLocation ? L.latLng(userLocation.lat, userLocation.lng) : L.latLng(shop.lat, shop.lng);
      const endPt = L.latLng(shop.lat, shop.lng);

      if (routingControl) map.removeControl(routingControl);

      routingControl = L.Routing.control({
        waypoints: [startPt, endPt],
        routeWhileDragging: false,
        addWaypoints: false,
        draggableWaypoints: false,
        fitSelectedRoutes: true,
        lineOptions: { styles: [{ color: '#1a73e8', opacity: 0.85, weight: 6 }] },
        createMarker: function() { return null; }
      }).addTo(map);

      const distKm = getDistanceKm(startPt.lat, startPt.lng, shop.lat, shop.lng).toFixed(2);
      document.getElementById("stopBadge").innerText = "Next Target Shop";
      document.getElementById("distanceText").innerText = `~${distKm} km away`;
      document.getElementById("activeShopName").innerText = shop.name;
      document.getElementById("activeActions").style.display = "flex";

      const callBtn = document.getElementById("callBtn");
      if (shop.phone) {
        callBtn.style.display = "inline-block";
        callBtn.href = `tel:${shop.phone}`;
      } else {
        callBtn.style.display = "none";
      }

      const gmapsBtn = document.getElementById("gmapsBtn");
      gmapsBtn.href = shop.mapsLink ? shop.mapsLink : `https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lng}`;
    }

    function markCurrentVisited() {
      if (!currentTargetShop) return;
      currentTargetShop.visited = true;

      userLocation = { lat: currentTargetShop.lat, lng: currentTargetShop.lng };
      updateUserMarker();

      sortShopsByNearestChain(userLocation.lat, userLocation.lng);
      routeToNextUnvisited();
    }

    function renderShopSequence() {
      const listEl = document.getElementById("shopList");
      listEl.innerHTML = "";
      areaShops.forEach((shop, idx) => {
        const item = document.createElement("div");
        item.className = "shop-item" + (shop.visited ? " visited" : "");
        item.onclick = () => drawRouteToShop(shop);
        item.innerHTML = `
          <div>
            <span class="shop-num">${idx + 1}</span>
            <strong>${shop.name}</strong>
          </div>
          <span style="color:#6b7280;font-size:12px;">${shop.visited ? "Visited" : "Route ➔"}</span>
        `;
        listEl.appendChild(item);
      });
    }

    loadSheetData();
  </script>
</body>
</html>
